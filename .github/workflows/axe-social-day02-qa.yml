name: AXE — Read-only UNESCO Day02 Carousel Image QA
on:
  push:
    branches: [axe/social-unesco-day02-image-qa-20261123]
    paths:
      - 'ops/social/day02_image_audit.py'
      - '.github/workflows/axe-social-day02-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.0.0
      - name: Audit eight actual images without modifying scheduled media
        run: python ops/social/day02_image_audit.py
      - name: Archive exact audit and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day02-unesco-eight-image-audit
          path: ops/social/day02-qa/
          retention-days: 7
          if-no-files-found: warn
